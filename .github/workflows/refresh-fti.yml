name: Refresh Fan Token Intel data

# Keeps data/fti.json (match events, capital rotation, candles) current on its own
# so the dashboard's Key Events timeline and chart stay up to date without manual work.

on:
  schedule:
    # Twice daily at 06:00 and 18:00 UTC. Adjust as you like.
    - cron: '0 6,18 * * *'
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-fti-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest FTI snapshot
        run: node fetch-fti-data.js

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain data/fti.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/fti.json
            git commit -m "chore: refresh Fan Token Intel data [skip ci]"
            git push
          else
            echo "No change in data/fti.json — nothing to commit."
          fi
